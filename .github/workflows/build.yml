name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and locate root
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} -d extracted \;
          echo "Extracted contents:"
          find extracted -maxdepth 3
          GRADLEW_PATH=$(find extracted -name "gradlew" | head -n 1)
          PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
          echo "Found project root at: $PROJECT_ROOT"
          cp -r "$PROJECT_ROOT"/. .
          rm -rf extracted *.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
