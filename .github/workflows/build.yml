name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and locate root
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} -d extracted \;
          PROJECT_ROOT=$(find extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Found project root at: $PROJECT_ROOT"
          shopt -s dotglob
          cp -r "$PROJECT_ROOT"/* .
          rm -rf extracted *.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
